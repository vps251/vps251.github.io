<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Scheme Assignment</title>
    <style>
        /* General table styling for logical presentation */
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        
        th, td {
            border: 1px solid #999;
            padding: 12px;
        }

        /* 1. Scheme Name Styling (Table Header) */
        th.scheme-title {
            font-size: 24px;
            font-weight: bold;
            font-style: italic;
            letter-spacing: 2px;
            background-color: #f5f5f5;
        }

        /* 2. Color Names Background Settings */
        .color-1 { background-color: #2c3e50; color: #ffffff; } /* Dark Blue / Text changed to white for contrast */
        .color-2 { background-color: #e74c3c; color: #ffffff; } /* Coral Red / Text changed to white for contrast */
        .color-3 { background-color: #f39c12; color: #000000; } /* Orange */
        .color-4 { background-color: #f1c40f; color: #000000; } /* Yellow */
    </style>
</head>
<body>

    <table>
        <thead>
            <tr>
                <th colspan="4" class="scheme-title">Sunset Palette</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="color-1">Midnight Blue</td>
                <td class="color-2">Sunset Red</td>
                <td class="color-3">Tangerine</td>
                <td class="color-4">Golden Sun</td>
            </tr>
            <tr>
                <td>#2c3e50</td>
                <td>#e74c3c</td>
                <td>#f39c12</td>
                <td>#f1c40f</td>
            </tr>
            <tr>
                <td>rgb(44, 62, 80)</td>
                <td>rgb(231, 76, 60)</td>
                <td>rgb(243, 156, 18)</td>
                <td>rgb(241, 196, 15)</td>
            </tr>
            <tr>
                <td>hsl(210, 29%, 24%)</td>
                <td>hsl(6, 78%, 57%)</td>
                <td>hsl(37, 90%, 51%)</td>
                <td>hsl(48, 89%, 50%)</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
